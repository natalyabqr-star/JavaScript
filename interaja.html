<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando eventos DOM </title>
</head>
<style>
    div#area{
            background-color: rgb(91, 91, 196);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 30px;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
    }

    
</style>
<body>
     <div id ="area">
        Interaja
        
     </div>


    <script>
    var a =window.document.getElementById('area')
    a.addEventListener('click', clicar)
    a.addEventListener('mouseenter', entrar)
    a.addEventListener('mouseout', sair)

    function clicar() {
        a.innerText = 'Clicou!'
        a.style.background = 'red'
    }
    function entrar() {
        a.innerText = 'Entrou!'

    }
    function sair() {
        a.innerText = 'Saiu!'
        a.style.background = 'green'
    }
    </script>
    
</body>
</html>
