<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando</title>
</head>
<body>
   <h1>Testando se você é estrangeiro</h1>
    <p>Digite seu país de origem:</p>
    <input type="text" name="pais" id="txtpais">
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res">
    </div>
    <script>
        function verificar() {
            var textp = window.document.querySelector('input#txtpais')
            var res = window.document.querySelector('div#res')
            var pais = textp.value
            res.innerHTML = `<p>Seu país de origem é ${pais}</p>`
            if (pais === "Brasil") {
                res.innerHTML += `<p>Você é brasileiro!</p>`
            }
            else if (pais === "Estados Unidos"){
                res.innerHTML += `<p>Você é americano!</p>`
            }
            else if (pais === "Japão"){
                res.innerHTML += `<p>Você é japonês!</p>`
            }
            else if (pais === "Alemanha"){
                res.innerHTML += `<p>Você é alemão!</p>`
            
            }
            else if (pais === "França") {
                res.innerHTML += `<p>Você é francês!</p>`
            }
            else {
                res.innerHTML += `<p>Você é estrangeiro!</p>`
            }
        }
    </script>
</body>
</html>
