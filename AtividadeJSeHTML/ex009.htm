<!DOCTYPE html>
<html lang="pt-be">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criando condições</title>

</head>
<body>
    <h1>Criando condições</h1>
    Velocidade do carro: <input type='number' name='vel' id='txtvel'> Km/h
    <input type='button' value='Verificar'onclick='calcular()'>
    <div id='res'>
        

    </div>
    
        <script>
            function calcular() {
                var textv = window.document.querySelector('input#txtvel')
                var res = window.document.querySelector('div#res')
                var vel = Number(textv.value)
                res.innerHTML = `<p>Sua velocidade atual é de ${vel} Km/h</p>`
                if (vel > 60) {
                    res.innerHTML += `<p>Você ultrapassou a velocidade permitida. MULTADO!</p>` 
                }
                else {
                    res.innerHTML += `<p>Dirija com cuidado e sempre usando cinto de segurança!</p>`
                }
            }
        </script>





</body>
</html>
